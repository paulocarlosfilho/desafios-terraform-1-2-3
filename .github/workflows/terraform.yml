name: "Terraform LocalStack CI"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  terraform-deploy:
    name: "Terraform Init, Plan & Apply"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start LocalStack (Slim/Fast)
        run: |
          docker run --rm -d \
            --name localstack \
            -p 4566:4566 \
            -e SERVICES=s3 \
            localstack/localstack
          
          echo "Aguardando o LocalStack S3 iniciar..."
          for i in {1..30}; do
            if curl -s http://localhost:4566/_localstack/health | grep -q "\"s3\": \"running\""; then
              echo "LocalStack S3 está rodando com sucesso!"
              exit 0
            fi
            echo "Tentativa $i/30: LocalStack ainda não respondeu, aguardando..."
            sleep 5
          done
          
          echo "ERRO: O LocalStack demorou muito para subir. Logs do container:"
          docker logs localstack
          exit 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve