name: "Terraform LocalStack CI"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  terraform-deploy:
    name: "Terraform Init, Plan & Apply"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start LocalStack (Slim/Fast)
        run: |
          docker run --rm -d \
            -p 4566:4566 \
            -e SERVICES=s3 \
            localstack/localstack
          
          echo "Aguardando o LocalStack S3 iniciar..."
          until curl -s http://localhost:4566/_localstack/health | grep -q "\"s3\": \"running\""; do
            sleep 2
          done
          echo "LocalStack S3 está rodando com sucesso!"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve